services:

  postgres:
    image: postgres:15.18
    container_name: content_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file: .env
    # Every published port is bound to 127.0.0.1: reachable from this machine
    # only, not from other devices on the same network. None of the services
    # are meant to be shared (Flask and Dagster have no login).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster-code:
    build: ./dagster
    container_name: content_dagster_code
    env_file: .env
    volumes:
      - ./dagster:/opt/dagster/app
      - ./dbt:/opt/dbt
      - dagster_home:/opt/dagster/dagster_home
    working_dir: /opt/dagster/app
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DBT_PROFILES_DIR: /opt/dbt
    depends_on:
      postgres:
        condition: service_healthy
    command: dagster code-server start -h 0.0.0.0 -p 4266 -f pipeline.py

  dagster:
    build: ./dagster
    container_name: content_dagster
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./dagster:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/app/workspace.yaml

  dagster-daemon:
    build: ./dagster
    container_name: content_dagster_daemon
    env_file: .env
    volumes:
      - ./dagster:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started
    command: dagster-daemon run -w /opt/dagster/app/workspace.yaml

  ollama:
    image: ollama/ollama:0.32.6
    container_name: content_ollama
    environment:
      # Two consumers now share this Ollama instance: flask (/ask, llama3.2:3b)
      # and dagster's picks generation (llama3.2:1b). Both models together are
      # ~3.9GB, well under this container's memory - without this, Ollama's
      # default keeps only 1 model resident and evicts/reloads on every switch
      # between the two, which turned a normal ~16s /ask answer into 201s.
      OLLAMA_MAX_LOADED_MODELS: 2
      # Ollama's default keep-alive (5min idle) unloads a model between uses
      # on a single-user personal app that isn't queried constantly - the
      # NEXT request then pays a full cold reload, confirmed live to cost
      # 200-300s vs ~45s warm for the identical question. Keep both models
      # resident indefinitely; memory easily allows it (see MAX_LOADED_MODELS
      # note above).
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  metabase:
    image: metabase/metabase:v0.63.5.2
    container_name: content_metabase
    ports:
      - "127.0.0.1:4000:3000"
    # Metabase's own app DB (H2: connections, questions, dashboards) lives at
    # /metabase.db by default - inside the container's writable layer, so any
    # recreate (down/up, image bump, --build) silently wiped it. Named volume
    # keeps it across container lifecycles.
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

  flask:
    build: ./flask
    container_name: content_flask
    env_file: .env
    volumes:
      - ./flask:/app
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # Daily pg_dump of content_db to ./backups/postgres, keeping the last 14.
  # The whole watch/read history lives in one Docker volume - a dropped
  # volume or a bad ingestion run would otherwise be unrecoverable.
  # Restore: pg_restore -U $POSTGRES_USER -d $POSTGRES_DB --clean <file>.dump
  postgres-backup:
    image: postgres:15.18
    container_name: content_postgres_backup
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/content_db_$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.tmp"; echo "backup FAILED" >&2
          fi
          ls -1t /backups/content_db_*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  postgres_data:
  dagster_home:
  ollama_data:
  metabase_data: